<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.1.8/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      
      <!-- Kad 1: Jangan Lari! -->
      <a-marker type="pattern" url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/three.js/examples/marker-training/examples/pattern-files/hiro.patt">
        <a-box color="red" position="0 0.5 0" animation="property: position; to: 0 1 0; dir: alternate; loop: true; dur: 1000"></a-box>
        <a-text value="Jangan lari!" color="yellow" position="-0.8 1.5 0" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <!-- Kad 2: Duduk Diam! -->
      <a-marker preset="kanji">
        <a-sphere color="blue" radius="0.5" position="0 0.5 0"></a-sphere>
        <a-text value="Duduk diam!" color="white" position="-0.8 1.5 0" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <!-- Kad 3: Angkat Tangan! -->
      <a-marker preset="a">
        <a-cylinder color="green" radius="0.3" height="1.2" position="0 0.6 0"></a-cylinder>
        <a-text value="Angkat tangan!" color="black" position="-1 1.5 0" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <!-- Kad 4: Buka Buku! -->
      <a-marker preset="b">
        <a-box color="orange" depth="0.2" height="0.5" width="1" position="0 0.5 0"></a-box>
        <a-text value="Buka buku!" color="purple" position="-0.8 1.5 0" scale="1.5 1.5 1.5"></a-text>
      </a-marker>

      <!-- Kamera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
